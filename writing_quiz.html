<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dutch A2 100 Practice Questions</title>
    <style>
        :root {
            --primary: #1b365d;
            --secondary: #0076a8;
            --accent: #e87722;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --correct: #2e7d32;
            --correct-bg: #e8f5e9;
            --incorrect: #c62828;
            --incorrect-bg: #ffebee;
            --border: #cccccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 850px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary);
            margin: 0 0 10px 0;
            font-size: 1.8rem;
        }

        p.subtitle {
            color: #666;
            margin: 0;
            font-size: 0.95rem;
        }

        .score-board {
            position: sticky;
            top: 10px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #eef3f8;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-weight: bold;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: #e0e6ed;
            color: var(--primary);
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--secondary);
            color: white;
        }

        .question-card {
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
            border-left: 5px solid var(--secondary);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .question-number {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--secondary);
            font-weight: bold;
            margin-bottom: 5px;
        }

        .english-prompt {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 15px;
            background: #fff;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px dashed #bbb;
        }

        .sentence-builder {
            font-size: 1.1rem;
            line-height: 2.2rem;
            margin-bottom: 15px;
        }

        select {
            font-size: 1rem;
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background-color: #ffffff;
            cursor: pointer;
            margin: 0 4px;
            font-weight: 600;
            color: var(--primary);
            transition: all 0.2s ease;
        }

        select:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 5px rgba(0, 118, 168, 0.4);
        }

        .word-order-label {
            font-size: 0.9rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 1rem;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #ddd;
            background: #fff;
        }

        .option-label:hover {
            background-color: #f0f7fc;
        }

        .option-label input[type="radio"] {
            margin-right: 10px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-check {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-check:hover {
            background-color: #d06312;
        }

        .feedback-box {
            margin-top: 15px;
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 0.95rem;
            display: none;
        }

        .feedback-box.correct {
            display: block;
            background-color: var(--correct-bg);
            color: var(--correct);
            border: 1px solid #a5d6a7;
        }

        .feedback-box.incorrect {
            display: block;
            background-color: var(--incorrect-bg);
            color: var(--incorrect);
            border: 1px solid #ef9a9a;
        }

        .explanation {
            font-size: 0.9rem;
            margin-top: 5px;
            color: #444;
            font-weight: normal;
        }

        .btn-reset {
            display: block;
            width: 100%;
            margin-top: 30px;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .btn-reset:hover {
            background-color: #122440;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Dutch A2 Practice: 100 Sentences & Word Order</h1>
        <p class="subtitle">Select the correct words and sentence structures based on official Inburgering exam prompts.</p>
    </header>

    <div class="score-board">
        <span>Completed: <span id="progress">0</span> / <span id="total-q">100</span></span>
        <span>Score: <span id="score">0</span> / <span id="total-score">100</span></span>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterQuestions('all')">All (100)</button>
        <button class="filter-btn" onclick="filterQuestions(1, 10)">1. Sick & Health</button>
        <button class="filter-btn" onclick="filterQuestions(11, 20)">2. Appointments</button>
        <button class="filter-btn" onclick="filterQuestions(21, 30)">3. Work & Shifts</button>
        <button class="filter-btn" onclick="filterQuestions(31, 40)">4. Neighbours</button>
        <button class="filter-btn" onclick="filterQuestions(41, 50)">5. Housing & Repairs</button>
        <button class="filter-btn" onclick="filterQuestions(51, 60)">6. Courses & School</button>
        <button class="filter-btn" onclick="filterQuestions(61, 70)">7. Free Time</button>
        <button class="filter-btn" onclick="filterQuestions(71, 80)">8. Shopping & Food</button>
        <button class="filter-btn" onclick="filterQuestions(81, 90)">9. Service & Library</button>
        <button class="filter-btn" onclick="filterQuestions(91, 100)">10. Email & Connectors</button>
    </div>

    <div id="quiz-container"></div>

    <button class="btn-reset" onclick="resetQuiz()">Reset All 100 Questions</button>
</div>

<script>
const questions = [
    {
        "id": 1,
        "english": "I am sick today and I cannot work.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Ik ben vandaag ziek en ik ", "SELECT_1", " niet ", "SELECT_2", "."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "kan", "kunnen", "kunt"], "correct": "kan"},
            {"id": "SELECT_2", "options": ["---", "werken", "werkt", "gewerkt"], "correct": "werken"}
        ],
        "explanation": "Modal verb <b>kan</b> takes the second position, and the second verb <b>werken</b> goes to the end as an infinitive."
    },
    {
        "id": 2,
        "english": "My daughter is sick and is not coming to school today.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Mijn dochter is ziek en ", "SELECT_1", " vandaag niet naar school."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "komt", "komen", "is gekomen"], "correct": "komt"}
        ],
        "explanation": "After <i>en</i>, the main clause word order continues with verb <b>komt</b> for third-person singular (<i>mijn dochter</i>)."
    },
    {
        "id": 3,
        "english": "I have an appointment with the GP at ten o'clock.",
        "type": "word_order_choice",
        "promptPrefix": "Choose the correct sentence starting with time (Om tien uur):",
        "options": [
            "Om tien uur ik heb een afspraak bij de huisarts.",
            "Om tien uur heb ik een afspraak bij de huisarts.",
            "Om tien uur een afspraak heb ik bij de huisarts."
        ],
        "correctIndex": 1,
        "explanation": "Inversion rule: when starting with time (<i>Om tien uur</i>), the verb <b>heb</b> comes before the subject <b>ik</b>."
    },
    {
        "id": 4,
        "english": "My son has the flu, so he stays home.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Mijn zoontje heeft griep, ", "SELECT_1", " ", "SELECT_2", " thuis."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "dus", "omdat", "want"], "correct": "dus"},
            {"id": "SELECT_2", "options": ["---", "blijft hij", "hij blijft", "blijft"], "correct": "blijft hij"}
        ],
        "explanation": "<b>Dus</b> acts as an adverbial connector that causes inversion (Verb + Subject: <b>blijft hij</b>) when introducing a conclusion."
    },
    {
        "id": 5,
        "english": "I cannot come because I have to go to the doctor.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Ik kan niet komen, ", "SELECT_1", " ik naar de dokter ", "SELECT_2", "."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "want", "omdat", "daarom"], "correct": "omdat"},
            {"id": "SELECT_2", "options": ["---", "moet gaan", "gaat moeten", "moet"], "correct": "moet gaan"}
        ],
        "explanation": "<b>Omdat</b> introduces a subclause, pushing verbs to the end: modal <b>moet</b> + infinitive <b>gaan</b>."
    },
    {
        "id": 6,
        "english": "Tomorrow I will let you know how I am doing.",
        "type": "word_order_choice",
        "promptPrefix": "Choose the correct sentence starting with 'Morgen':",
        "options": [
            "Morgen ik laat weten hoe het met mij gaat.",
            "Morgen laat ik weten hoe het met mij gaat.",
            "Morgen laat weten ik hoe het met mij gaat."
        ],
        "correctIndex": 1,
        "explanation": "Starting with <i>Morgen</i> causes inversion: Verb (<b>laat</b>) + Subject (<b>ik</b>)."
    },
    {
        "id": 7,
        "english": "My child will come back to school tomorrow if they feel better.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Mijn kind komt morgen weer naar school ", "SELECT_1", " het beter ", "SELECT_2", "."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "als", "want", "daarom"], "correct": "als"},
            {"id": "SELECT_2", "options": ["---", "gaat", "gaan", "is gegaan"], "correct": "gaat"}
        ],
        "explanation": "<b>Als</b> (if/when) introduces a subclause, sending verb <b>gaat</b> to the end."
    },
    {
        "id": 8,
        "english": "I am going to the pharmacy to get medicines.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Ik ga naar de apotheek om medicijnen ", "SELECT_1", "."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "te halen", "halen", "gehaald"], "correct": "te halen"}
        ],
        "explanation": "Structure <b>om + [object] + te + infinitive</b> expresses purpose ('in order to get')."
    },
    {
        "id": 9,
        "english": "Cheer up, soon you will feel better!",
        "type": "dropdown_and_order",
        "sentenceParts": ["Kop op, straks ", "SELECT_1", " je je weer beter!"],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "voel", "voelt", "voelen"], "correct": "voel"}
        ],
        "explanation": "With inversion (<i>straks voel je</i>), the verb ending <i>-t</i> is dropped when <b>je/jij</b> immediately follows!"
    },
    {
        "id": 10,
        "english": "I am sending this email because I want to report sick.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Ik stuur deze e-mail ", "SELECT_1", " ik mij wil ", "SELECT_2", "."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "omdat", "want", "daarom"], "correct": "omdat"},
            {"id": "SELECT_2", "options": ["---", "ziekmelden", "ziekgemeld", "ziek meldt"], "correct": "ziekmelden"}
        ],
        "explanation": "Subclause with <b>omdat</b> pushes the infinitive <b>ziekmelden</b> to the end next to modal <i>wil</i>."
    },
    {
        "id": 11,
        "english": "I have an appointment on Monday at ten o'clock.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Ik ", "SELECT_1", " een afspraak op maandag om tien uur."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "heb", "heeft", "hebben"], "correct": "heb"}
        ],
        "explanation": "Standard V2 order: Subject (<b>Ik</b>) + Verb (<b>heb</b>)."
    },
    {
        "id": 12,
        "english": "I cannot come tomorrow because I have to work.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Ik kan morgen niet komen, ", "SELECT_1", " ik moet ", "SELECT_2", "."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "want", "omdat", "daarom"], "correct": "want"},
            {"id": "SELECT_2", "options": ["---", "werken", "werkt", "gewerkt"], "correct": "werken"}
        ],
        "explanation": "<b>Want</b> maintains standard main clause word order (Subject + Verb: <i>ik moet werken</i>)."
    },
    {
        "id": 13,
        "english": "Can we meet on Friday at two o'clock?",
        "type": "word_order_choice",
        "promptPrefix": "Choose the correct question structure:",
        "options": [
            "Wij kunnen vrijdag om twee uur afspreken?",
            "Kunnen wij vrijdag om twee uur afspreken?",
            "Vrijdag om twee uur kunnen afspreken wij?"
        ],
        "correctIndex": 1,
        "explanation": "Yes/No questions start with the verb: <b>Kunnen</b> + Subject (<b>wij</b>) + time + infinitive at the end (<b>afspreken</b>)."
    },
    {
        "id": 14,
        "english": "Could you please give me a new date?",
        "type": "dropdown_and_order",
        "sentenceParts": ["Kunt u mij alstublieft een nieuwe datum ", "SELECT_1", "?"],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "geven", "geeft", "gegeven"], "correct": "geven"}
        ],
        "explanation": "Polite request with modal <b>Kunt</b> requires infinitive <b>geven</b> at the end of the sentence."
    },
    {
        "id": 15,
        "english": "I would like to move my appointment to Tuesday.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Ik wil mijn afspraak ", "SELECT_1", " naar dinsdag."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "verplaatsen", "verplaatst", "verplaatste"], "correct": "verplaatsen"}
        ],
        "explanation": "Modal verb <b>wil</b> takes infinitive <b>verplaatsen</b>."
    },
    {
        "id": 16,
        "english": "Dear Madam, I cannot come to the appointment tomorrow.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Beste mevrouw, ik kan morgen niet naar de afspraak ", "SELECT_1", "."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "komen", "komt", "kwam"], "correct": "komen"}
        ],
        "explanation": "Modal verb <i>kan</i> pairs with infinitive <b>komen</b>."
    },
    {
        "id": 17,
        "english": "I am sorry, but I have to cancel our appointment.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Het spijt me, maar ik moet onze afspraak ", "SELECT_1", "."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "afzeggen", "afgezegd", "afzegt"], "correct": "afzeggen"}
        ],
        "explanation": "Separable infinitive <b>afzeggen</b> stays combined at the end after modal <i>moet</i>."
    },
    {
        "id": 18,
        "english": "Let me know if Tuesday suits you.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Laat even weten ", "SELECT_1", " dinsdag jou ", "SELECT_2", "."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "of", "dat", "want"], "correct": "of"},
            {"id": "SELECT_2", "options": ["---", "uitkomt", "komt uit", "uitkomen"], "correct": "uitkomt"}
        ],
        "explanation": "<b>Of</b> (if/whether) introduces a subclause: separable verb attaches back together at the end (<b>uitkomt</b>)."
    },
    {
        "id": 19,
        "english": "Can I make a new appointment on Wednesday?",
        "type": "word_order_choice",
        "promptPrefix": "Choose the correct question order:",
        "options": [
            "Kan ik een nieuwe afspraak op woensdag maken?",
            "Ik kan op woensdag een nieuwe afspraak maken?",
            "Kan maken ik op woensdag een nieuwe afspraak?"
        ],
        "correctIndex": 0,
        "explanation": "Verb first (<b>Kan</b>) + Subject (<b>ik</b>) + Object/Time + Infinitive (<b>maken</b>)."
    },
    {
        "id": 20,
        "english": "Unfortunately I am late because my train is delayed.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Ik ben helaas te laat, ", "SELECT_1", " mijn trein vertraging ", "SELECT_2", "."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "want", "omdat", "daarom"], "correct": "want"},
            {"id": "SELECT_2", "options": ["---", "heeft", "heb", "hebben"], "correct": "heeft"}
        ],
        "explanation": "<b>Want</b> maintains main clause structure: Subject (<i>mijn trein</i>) + Verb (<i>heeft vertraging</i>)."
    },
    {
        "id": 21,
        "english": "I would like to swap a shift because I have a party.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Ik wil graag een dienst ruilen, ", "SELECT_1", " ik een feest ", "SELECT_2", "."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "omdat", "want", "daarom"], "correct": "omdat"},
            {"id": "SELECT_2", "options": ["---", "heb", "heeft", "hebben"], "correct": "heb"}
        ],
        "explanation": "<b>Omdat</b> sends the conjugated verb <b>heb</b> to the very end of the subclause."
    },
    {
        "id": 22,
        "english": "I can work for you on Monday.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Ik kan maandag voor jou ", "SELECT_1", "."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "werken", "werkt", "gewerkt"], "correct": "werken"}
        ],
        "explanation": "Modal verb <i>kan</i> + infinitive <b>werken</b>."
    },
    {
        "id": 23,
        "english": "I now work at a supermarket in the city center.",
        "type": "word_order_choice",
        "promptPrefix": "Choose the correct sentence starting with Subject (Ik):",
        "options": [
            "Ik werk nu bij een supermarkt in het centrum.",
            "Ik nu werk bij een supermarkt in het centrum.",
            "Werk ik nu bij een supermarkt in het centrum."
        ],
        "correctIndex": 0,
        "explanation": "Subject (<b>Ik</b>) + Verb in position 2 (<b>werk</b>) + Time (<i>nu</i>) + Place."
    },
    {
        "id": 24,
        "english": "My work starts at nine o'clock.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Mijn werk ", "SELECT_1", " om negen uur."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "begint", "begin", "beginnen"], "correct": "begint"}
        ],
        "explanation": "Singular subject <i>Mijn werk</i> gets verb ending <i>-t</i> (<b>begint</b>)."
    },
    {
        "id": 25,
        "english": "I work three days per week: Monday, Wednesday, and Friday.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Ik ", "SELECT_1", " drie dagen per week: maandag, woensdag en vrijdag."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "werk", "werkt", "werken"], "correct": "werk"}
        ],
        "explanation": "First-person singular pronoun <b>Ik</b> uses stem verb <b>werk</b>."
    },
    {
        "id": 26,
        "english": "The work is busy sometimes, but I like it.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Het werk is soms druk, ", "SELECT_1", " ik vind het leuk."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "maar", "omdat", "daarom"], "correct": "maar"}
        ],
        "explanation": "<b>Maar</b> (but) is a coordinating conjunction with normal word order."
    },
    {
        "id": 27,
        "english": "Would you vacuum the shop later?",
        "type": "dropdown_and_order",
        "sentenceParts": ["Wil je straks de winkel ", "SELECT_1", "?"],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "stofzuigen", "stofzuigt", "gestofzuigd"], "correct": "stofzuigen"}
        ],
        "explanation": "Modal question <i>Wil je...</i> takes infinitive <b>stofzuigen</b> at the end."
    },
    {
        "id": 28,
        "english": "Please hang the clothes on the rack.",
        "type": "dropdown_and_order",
        "sentenceParts": ["", "SELECT_1", " de kleren alstublieft aan het rek."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "Hang", "Hangen", "Hangt"], "correct": "Hang"}
        ],
        "explanation": "Imperative command form uses the verb stem: <b>Hang</b>."
    },
    {
        "id": 29,
        "english": "Lock the door when you are finished.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Doe de deur op slot ", "SELECT_1", " je klaar bent."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "als", "want", "daarom"], "correct": "als"}
        ],
        "explanation": "<b>Als</b> (when) introduces time subclause."
    },
    {
        "id": 30,
        "english": "I saw your job vacancy for a part-time job.",
        "type": "dropdown_and_order",
        "sentenceParts": ["Ik ", "SELECT_1", " uw vacature gezien voor een parttime baan."],
        "dropdowns": [
            {"id": "SELECT_1", "options": ["---", "heb", "heeft", "ben"], "correct": "heb"}
        ],
        "explanation": "Present Perfect tense: auxiliary verb <b>heb</b> + past participle <i>gezien</i>."
    },
    {
        "id": 31,
        "english": "Thank you for accepting my package.",
        "type": "dropdown_and_order",

let userState = {};

function initQuiz() {
    const container = document.getElementById("quiz-container");
    container.innerHTML = "";
    document.getElementById("total-q").innerText = questions.length;
    document.getElementById("total-score").innerText = questions.length;

    questions.forEach((q) => {
        userState[q.id] = { answered: false, correct: false };

        const card = document.createElement("div");
        card.className = "question-card";
        card.id = `q-card-${q.id}`;

        let html = `
            <div class="question-number">Question ${q.id} of 100</div>
            <div class="english-prompt">"${q.english}"</div>
        `;

        if (q.type === "dropdown_and_order") {
            html += `<div class="sentence-builder">`;
            q.sentenceParts.forEach(part => {
                if (part.startsWith("SELECT_")) {
                    const drop = q.dropdowns.find(d => d.id === part);
                    html += `<select id="drop-${q.id}-${drop.id}">`;
                    drop.options.forEach(opt => {
                        html += `<option value="${opt}">${opt}</option>`;
                    });
                    html += `</select>`;
                } else {
                    html += `<span>${part}</span>`;
                }
            });
            html += `</div>`;
        } else if (q.type === "word_order_choice") {
            html += `<div class="word-order-label">${q.promptPrefix}</div>`;
            html += `<div class="option-group">`;
            q.options.forEach((opt, oIdx) => {
                html += `
                    <label class="option-label">
                        <input type="radio" name="wo-${q.id}" value="${oIdx}">
                        ${opt}
                    </label>
                `;
            });
            html += `</div>`;
        }

        html += `
            <div class="actions">
                <button class="btn-check" onclick="checkAnswer(${q.id})">Check Answer</button>
            </div>
            <div class="feedback-box" id="feedback-${q.id}"></div>
        `;

        card.innerHTML = html;
        container.appendChild(card);
    });

    updateScoreBoard();
}

function checkAnswer(qId) {
    const q = questions.find(item => item.id === qId);
    const feedbackBox = document.getElementById(`feedback-${qId}`);
    let isCorrect = true;

    if (q.type === "dropdown_and_order") {
        q.dropdowns.forEach(drop => {
            const selectElem = document.getElementById(`drop-${q.id}-${drop.id}`);
            if (selectElem.value !== drop.correct) {
                isCorrect = false;
            }
        });
    } else if (q.type === "word_order_choice") {
        const selected = document.querySelector(`input[name="wo-${q.id}"]:checked`);
        if (!selected || parseInt(selected.value) !== q.correctIndex) {
            isCorrect = false;
        }
    }

    userState[qId].answered = true;
    userState[qId].correct = isCorrect;

    if (isCorrect) {
        feedbackBox.className = "feedback-box correct";
        feedbackBox.innerHTML = `<b>Correct! 🎉</b><div class="explanation">${q.explanation}</div>`;
    } else {
        feedbackBox.className = "feedback-box incorrect";
        feedbackBox.innerHTML = `<b>Not quite right. Try again!</b><div class="explanation">${q.explanation}</div>`;
    }

    updateScoreBoard();
}

function filterQuestions(start, end) {
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    questions.forEach(q => {
        const card = document.getElementById(`q-card-${q.id}`);
        if (start === 'all') {
            card.style.display = 'block';
        } else if (q.id >= start && q.id <= end) {
            card.style.display = 'block';
        } else {
            card.style.display = 'none';
        }
    });
}

function updateScoreBoard() {
    let score = 0;
    let completed = 0;

    Object.keys(userState).forEach(key => {
        if (userState[key].answered) {
            completed++;
            if (userState[key].correct) score++;
        }
    });

    document.getElementById("score").innerText = score;
    document.getElementById("progress").innerText = completed;
}

function resetQuiz() {
    initQuiz();
}

window.onload = initQuiz;
